<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lantern Cove — Spot the Difference</title>
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<header class="hud">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true"></span>
    <h1>Lantern Cove</h1>
    <span class="tagline">Spot the Difference</span>
  </div>
  <div class="stats">
    <div class="stat" id="stat-level"><span class="stat-label">Scene</span><span class="stat-value" id="level-name">—</span></div>
    <div class="stat highlight" id="stat-remaining"><span class="stat-label">Remaining</span><span class="stat-value" id="remaining-count">7</span></div>
    <div class="stat"><span class="stat-label">Found</span><span class="stat-value" id="found-count">0 / 7</span></div>
    <div class="stat"><span class="stat-label">Time</span><span class="stat-value" id="time-value">0:00</span></div>
    <div class="stat"><span class="stat-label">Misses</span><span class="stat-value" id="miss-count">0</span></div>
  </div>
  <div class="actions">
    <button id="btn-hint" type="button" title="Hint (H)">Hint</button>
    <button id="btn-sound" type="button" title="Sound (M)">Sound: On</button>
    <button id="btn-restart" type="button" title="Restart scene (R)">Restart</button>
    <button id="btn-menu" type="button" title="Scene menu">Scenes</button>
  </div>
</header>
<main class="stage">
  <canvas id="game" width="1240" height="700" aria-label="Spot the difference: two near-identical pictures side by side. Click a difference in either picture."></canvas>
  <p id="status" role="status" aria-live="polite"></p>
  <section id="overlay" class="overlay" hidden>
    <div class="card" id="overlay-card"></div>
  </section>
</main>
<footer class="help">
  <span>Click a difference in either picture — or move the crosshair with the arrow keys and press Enter.</span>
  <span><b>H</b> hint · <b>R</b> restart · <b>M</b> sound</span>
</footer>
<script type="module" src="./src/main.js"></script>
</body>
</html>
